[workspace]
authors = ["VedangAsgaonkar <vedanga2015@gmail.com>"]
channels = ["conda-forge"]
name = "ctui"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = ">=3.11"
questionary = ">=2.1.1,<3"
pygments = ">=2.17,<3"
hatchling = ">=1.32.0,<2"

[pypi-dependencies]
ctui = { path = ".", editable = true }

[tasks]
ctui = "ctui"
# Prints the absolute path of the `ctui` shim to put on your PATH.
where = "python -c \"import shutil; print(shutil.which('ctui'))\""

[feature.dev.dependencies]
pytest = ">=8"

[feature.dev.tasks]
test = "pytest -q"

[environments]
dev = ["dev"]
